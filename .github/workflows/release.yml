name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create zip
        run: zip -r BoxedDataPack.zip BoxedDataPack/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BoxedDataPack.zip
          generate_release_notes: true
